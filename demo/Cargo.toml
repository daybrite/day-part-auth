[package]
name = "auth-demo"
version = "0.1.1"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

# Lint policy: Clippy's `pedantic` group is on, and CI treats every warning as an error
# (`-D warnings`). The table matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
uikit = ["day/uikit"]
material = ["day/material"]
dom = ["day/dom"]
winui = ["day/winui"]
arkui = ["day/arkui"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The bare canonical URL, no ref: see ../Cargo.toml for why a ref would double the graph. No lock
# is committed, so every build resolves day at the tip of main.
day = { package = "day-app", version = "0.*" }
# The part under test, by path: a change to the part and to the demo land in one pull request
# and one CI run. Other apps use the published crate:
#     day-part-auth = "0.*"
day-part-auth = { version = "0.*", path = ".." }
# The tokens' claims and the userinfo answer are JSON values the page prints.
serde_json = "1"

# The built-in demo provider is a loopback HTTP server, which a browser page cannot run; the web
# build keeps the sign-in UI and signs in to a provider you point it at.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
day-part-auth = { version = "0.*", path = "..", features = ["demo-provider"] }

[build-dependencies]
day-build = "0.*"

[workspace]
